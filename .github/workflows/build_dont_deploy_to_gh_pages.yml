name: test-build-jupyter-book

# Test that the book builds. Runs on pull requests (and by hand) only — the deploy
# workflow already full-builds on pushes to master, so building here too would just
# double the work on every master push.
on:
  pull_request:

  workflow_dispatch:

    # If your git repository has the Jupyter Book within some-subfolder next to
    # unrelated files, you can make this run only if a file within that specific
    # folder has been modified.
    #
    # paths:
    # - some-subfolder/**

# This job installs dependencies, build the book, and pushes it to `gh-pages`
jobs:
  test-book-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Install dependencies
      # - name: Set up Python 3.7
      #   uses: actions/setup-python@v1
      #   with:
      #     python-version: 3.7

      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ./.github/workflows/envs/build_jb.yml
          cache-downloads: true
          cache-environment: true

      # Build the book
      - name: Build the book
        shell: bash -l {0}
        run: |
          cd Jupyterbook
          source build_book.sh

      # Push the book's HTML to github-pages
