## Where we left off (Module 1.3)

We have met the concept of strain before. In [Module 1.3](Module-i-GlobalTectonics-3.reveal.html#/6) we established that:

- strain is **relative** and **dimensionless** &mdash; $\varepsilon = \delta L / L_0$, often quoted as a percentage
- like stress it has **orientation**: there are principal directions, and principal strains
- tectonic strain rates are around $10^{-15}\ \mathrm{s}^{-1}$ &mdash; [§7](Module-i-GlobalTectonics-3.reveal.html#/7) worked the plate-boundary estimate, 500 km taken up at 5 cm/yr

*What this module adds:* the strain **tensor**, its principal values and invariants, the **Flinn diagram**, and how strain is actually **measured** in a rock.

## Deformation
<div class="cols">
<div class="wide">

Deformation is any process that changes the shape, size or position of a body. Put a solid under external forces and it responds &mdash; and there are only four ways it can:

- **Translation** &mdash; a change of position
- **Rotation** &mdash; a change of orientation
- **Distortion** &mdash; a change of shape
- **Dilation** &mdash; a change of volume

The first two are **rigid-body** deformation: the body moves or turns, but is not itself altered. The last two are **strain**.

</div>

</div>

## Displacement Vector
<div class="cols">
<div>

![](Module-iii-Theory/Lecture2-extracted/slide009_img2.jpg)

</div>
<div>

![](Module-iii-Theory/Lecture2-extracted/slide009_img1.jpg) <!-- .element style="width:74%;" -->

</div>
</div>

<p class="caption">Fossen, 2010</p>

Every deformation is built from the displacements of the particles that make it up, so a **displacement field** describes all four kinds at once. But distortion is the awkward one: a distorted rock is longer in some directions and shorter in others, and the angles between lines change too. No single number and no single arrow can hold that &mdash; which is why strain has to be a **tensor**.

Note:
Distortion is by far the most complicated type of deformation to measure. When rocks are distorted they typically get longer in some directions and shorter in others. Also, angles change in distortion. Because of this, strain cannot be represented by a scalar or a vector. It is a more complicated quantity that is called a tensor.

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 10 · template: T3-text-and-image -->
## Strain
<div class="cols">
<div class="wide">

Strain is the **non-rigid** half of deformation &mdash; distortion and dilation. It is relative and dimensionless, as in [Module 1.3 §6](Module-i-GlobalTectonics-3.reveal.html#/6), and it is **detached from its history**: a given strain may have been arrived at in an infinite number of ways.

To read strain out of a deformed rock we need a **strain marker** &mdash; an object whose original shape we can guess at, so that its present shape tells us what happened to it:

- pebbles and ooids
- mineral grains and xenoliths
- pillows in pillow lava
- trilobites and worm burrows

</div>
<div>

![](Module-iii-Theory/Lecture2-extracted/slide010_img1.jpg) <!-- .element style="width:72%;" -->

<p class="caption">Strained quartz pebbles in conglomerate, near Dalton, MA, USA &middot; Fossen, 2010</p>

</div>
</div>


<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 11 · template: T3-text-and-image -->
## Homogeneous & Heterogeneous Strain
<div class="cols">
<div class="wide">

**Homogeneous** strain is the same everywhere in the body. Straight lines stay straight, parallel lines stay parallel, and a circle becomes an ellipse. **Heterogeneous** strain is anything else: straight lines may bend, and lines that began parallel are turned by different amounts and end up crossing.

Two things follow, and both matter in the field:

- The distinction is one of **scale**. A deformation that is heterogeneous across an outcrop may be homogeneous within any one hand specimen.
- Strain analysis rests on continuum mechanics &mdash; the mechanics of materials whose properties vary *smoothly* &mdash; so it needs a scale on which the strain is homogeneous.

</div>
<div>

## Longitudinal Strain

<div class="cols">
<div>

![](Module-iii-Theory/Lecture2-restored/strain-longitudinal.png)

<p class="caption">A trilobite stretched along one line &middot; <a href="https://openeducationalberta.ca/introductorystructuralgeology">Introductory Structural Geology</a>, Open Education Alberta</p>

</div>
<div class="wide">

Also called **normal strain**: what happens to the *length* of a line.

- **Elongation** $\epsilon$ &mdash; how much longer, as a fraction of what it was:

$$\epsilon = \frac{l - l_0}{l_0}$$

- **Stretch** $s$ &mdash; the same information as a ratio, so $s = 1$ means unchanged:

$$s = \frac{l}{l_0} \qquad \textrm{hence} \qquad s = 1 + \epsilon$$

- **Quadratic elongation** $\lambda = s^2$, which is the one that falls out of the strain ellipse.

</div>
</div>

<--o-->

## Angular Strain

<div class="cols">
<div>

![](Module-iii-Theory/Lecture2-restored/strain-angular.png)

</div>
<div>

![](Module-iii-Theory/Lecture2-restored/strain-shearbox.png)

</div>
</div>

<p class="caption">Two lines that started perpendicular, and no longer are &middot; <a href="https://openeducationalberta.ca/introductorystructuralgeology">Introductory Structural Geology</a>, Open Education Alberta</p>

Also called **shear strain**: what happens to the *angle* between two lines that started perpendicular.

- The **angular shear** $\phi$ is how far one of them has swung.
- The **shear strain** is its tangent, $\gamma = \tan\phi = \Delta x / y$ &mdash; the offset divided by the width it is spread across.
- Sign convention: **positive when the angle closes**.

<small>Many texts, and the trilobite figure above, write the angular shear as $\psi$ rather than $\phi$. Same angle.</small>

<--o-->

## Volumetric Strain

<div class="cols">
<div>

![](Module-iii-Theory/Lecture2-restored/strain-volumetric.png) <!-- .element style="width:62%;" -->

<p class="caption">Dilation &mdash; every direction at once &middot; <a href="https://openeducationalberta.ca/introductorystructuralgeology">Introductory Structural Geology</a>, Open Education Alberta</p>

</div>
<div class="wide">

What happens to the *volume*, independent of any shape change.

$$\delta = \frac{v - v_0}{v_0} = \frac{\Delta v}{v_0}$$

Positive is **dilation**, negative is **compaction**. Deformation that changes shape but not volume &mdash; pure shear and simple shear both &mdash; has $\delta = 0$, which is why the assumption turns up so often.

</div>
</div>

<--o-->

## Example: Quantify Strain in a Rock


![](Module-iii-Theory/Lecture2-restored/slide015.png)

<p class="caption">Magali Billen, UC Davis</p>


The fault trace gives the relative movement across the zone directly, so no marker is needed:

$$\epsilon_s = \frac{\Delta x}{y} = \frac{5}{0.5} = 10 \qquad \gamma = \tan^{-1}(10) \times \frac{180}{\pi} = 84.3°$$

A shear strain of 10 is enormous &mdash; the marker has been laid over to within six degrees of the shear plane.


Note:
The key to quantify strain is to find the right geometry describing the deformation.

## Quantify Strain with Displacement

Translation, rotation, distortion and dilation are all the result of particles moving, so all four can be written as a **displacement field**. To handle a *continuous* deformation we need the general expression &mdash; and the trick is the one used to get a speed: take a difference, then let the interval shrink.

<div class="cols">
<div>

![](Module-iii-Theory/Lecture2-restored/s16-stretching-beam.png)

</div>
<div class="wide">

Start with the simplest case, a beam stretched along its own length:

$$\epsilon_{11} = \frac{\Delta l}{l_0} = \frac{A'B' - AB}{AB} = \frac{BB' - AA'}{AB} = \frac{u_1(B) - u_1(A)}{AB}$$

Expand $u_1(B)$ as a series about $A$:

$$u_1(B) \approx u_1(A) + \frac{\partial u_1}{\partial x_1}\cdot AB$$

and the finite difference becomes a derivative:

$$\epsilon_{11} = \frac{\partial u_1}{\partial x_1}$$

The subscript 1 marks the single direction involved.

</div>
</div>

<small>(Advanced)</small>

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 17 · as slide 16: a drawn
     diagram that never converted, leaving sixteen loose labels behind. -->
## Quantify Strain with Displacement

The same argument in two dimensions, shearing a rectangle rather than stretching a beam.

![](Module-iii-Theory/Lecture2-restored/s17-shear-derivation.png) <!-- .element style="display:block; margin-left:auto; margin-right:auto; width:80%" -->

In **simple shear** only one pair of sides tilts; in **sub-simple shear** both do, by different amounts. The same series expansion gives $\epsilon_{12} = \partial u_1/\partial x_2$, and the same argument with the axes swapped gives $\epsilon_{21} = \partial u_2/\partial x_1$. The strain tensor takes the average of the two, which is what makes it symmetric:

$$\epsilon_{12} = \epsilon_{21} = \frac{1}{2}\left( \frac{\partial u_2}{\partial x_1}+\frac{\partial u_1}{\partial x_2} \right)$$

<small>(Advanced)</small>

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 18 · template: T3-text-and-image -->
## Strain Tensor
<div class="cols">
<div class="wide">

The whole strain state follows from one idea &mdash; displacement in one direction, differentiated with respect to position in another:
$$\epsilon_{ij}=\frac{1}{2}\left[ \frac{{\partial u} _ {i}}{{\partial x} _ {j}}+\frac{{\partial u} _ {j}}{{\partial x} _ {i}} \right]$$
where $u_i$ is the displacement in direction $i$, and $i$ and $j$ each run over 1, 2, 3 &mdash; the coordinates $x, y, z$ written as $x_1, x_2, x_3$.

Exactly as for stress, describing the full state takes three 3-component vectors, which is to say a **tensor**:
$$\left[ \begin{matrix} \epsilon_{11} & \epsilon_{12} & \epsilon_{13} \cr \epsilon_{21} & \epsilon_{22} & \epsilon_{23} \cr \epsilon_{31} & \epsilon_{32} & \epsilon_{33} \end{matrix} \right]$$

It can carry volumetric, normal and shear components all at once.

</div>
<div>

![](Module-iii-Theory/Lecture2-extracted/slide018_img1.jpg)

</div>
</div>

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 19 · template: T3-text-and-image -->
## Principal Strain: Strain Ellipsoid
<div class="cols">
<div class="wide">

Just as for stress, the strain tensor can be diagonalised, leaving only the principal strains $e_1$, $e_2$ and $e_3$:
- $\left[ \begin{matrix} \epsilon_{11} & \epsilon_{12} & \epsilon_{13} \cr \epsilon_{21} & \epsilon_{22} & \epsilon_{23} \cr \epsilon_{31} & \epsilon_{32} & \epsilon_{33} \end{matrix} \right]$ becomes $\left[ \begin{matrix} e_1 & 0 & 0 \cr 0 & e_2 & 0 \cr 0 & 0 & e_3 \end{matrix} \right]$
Those three numbers define a **strain ellipsoid** &mdash; the same object whatever axes we happened to find it in. In three dimensions its *shape* takes two ratios to pin down, and plotting those two ratios against each other is the Flinn diagram.

</div>
<div>

![](Module-iii-Theory/Lecture2-extracted/slide019_img1.jpg) <!-- .element style="width:54%;" -->

<p class="caption">Patrice Rey, USyd</p>

![](Module-iii-Theory/Lecture2-extracted/slide019_img2.jpg) <!-- .element style="width:91%;" -->

<p class="caption">$e_1 \ge e_2 \ge e_3$</p>

</div>
</div>

Note:
A strain ellipsoid has three lines X,Y and Z that are special. They represent the maximum and minimum stretches, called sX and sZ respectively, and a third, intermediate axis of intermediate stretch sY, that is mutually perpendicular to the other two.

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 20 · template: T3-text-and-image -->
## On the Symbols of Principal Strain
<div class="cols">
<div class="wide">

Several quantities to define the normal strain
- Elongation ($\epsilon$) of a line
- $\epsilon = \frac{l-l_0}{l_0}$
- Stretching of a line
- $s=\frac{l}{l_0}$, thus $s = 1 + \epsilon$
- Quadratic elongation $\lambda = s^2$

In general, principal strain uses the stretching factors $S_1$, $S_2$, $S_3$, which sometimes are also denoted as X, Y or Z. With this, X=Y=Z=1 means no deformation.
- The notations for principal strain below tell the same story:
$$\begin{matrix}
 X = S_1 = e_1 = 1 + \epsilon_1 = \sqrt{\lambda_1} \cr
 Y = S_2 = e_2 = 1 + \epsilon_2 = \sqrt{\lambda_2} \cr
 Z = S_3 = e_3 = 1 + \epsilon_3 = \sqrt{\lambda_3}
\end{matrix}$$

</div>
<div>

![](Module-iii-Theory/Lecture2-extracted/slide020_img1.jpg) <!-- .element style="width:91%;" -->

<p class="caption">$e_1 \ge e_2 \ge e_3$</p>

</div>
</div>

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 21 · template: T3-text-and-image -->
## Volume Change
<div class="cols">
<div class="wide">

Volumetric strain compares the volume before and after:

$$\Delta = \frac{V - V_0}{V_0}$$

A volume change is **isotropic** if only the size changes, and **anisotropic** if the shape changes too.

A deformation is **coaxial** when the same material lines stay principal through every increment &mdash; the axes of the strain ellipsoid do not rotate through the material. Pure shear is the standard example.

</div>
<div>

![](Module-iii-Theory/Lecture2-extracted/slide021_img1.jpg)

![](Module-iii-Theory/Lecture2-extracted/slide021_img2.jpg)

<p class="caption">Coaxial deformation (pure shear) · Fossen, 2010</p>

</div>
</div>

Note:
The flinn diagram summaries the different geometry of resulted deformation in one plot, and nicely separates the prolate geometries or cigar shapes of the upper half of the field from oblate geometries or pancake shapes of the lower half. However, one type of strain is not clearly shown, which is the volume change.

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 22 · template: T3-text-and-image -->
## Uniaxial Strain – Compaction
<div class="cols">
<div class="wide">

**Uniaxial** strain shortens or extends along one principal axis while the other two keep their length. Something has to give, so it demands that rock volume be reorganised, added or removed: it is an anisotropic volume change, though still a coaxial one. Losing volume gives uniaxial contraction &mdash; **compaction**; gaining it gives uniaxial extension.

The everyday example is sediment under its own overburden, losing porosity as it is buried. That is part of lithification, physical and chemical together, and porosity falls off with depth as

$$\phi(z) = \phi_0\\,e^{-Cz}$$

with $\phi_0$ the initial porosity and $C$ a constant.

</div>
<div>

![](Module-iii-Theory/Lecture2-restored/s22-compaction.jpeg) <!-- .element style="max-height:620px;" -->

<p class="caption">Unconsolidated sediment compacts as fluid is driven out · Fossen, 2010</p>

</div>
</div>

Note:
This happens through grain reorganization during physical compaction of porous sediments and tuffs near the surface, leading to a denser packing of grains. Only water, oil or gas that filled the pore space leaves the rock volume, not the rock minerals themselves. 
In calcareous rocks and deeply buried siliciclastic sedimentary rocks, uniaxial strain can be accommodated by (pressure) solution, also referred to as chemical compaction. In this case, minerals are dissolved and transported out of the rock volume by fluids. Removal of minerals by diffusion can also occur under metamorphic conditions in the middle and lower crust. This can result in cleavage formation or can lead to compaction across shear zones. Uniaxial extension implies expansion in one direction. This may occur by the formation of tensile fractures or veins or during metamorphic reactions. 
When a layer of sediment is originally deposited, it contains an open framework of particles with the pore space being usually filled with water. As more sediment is deposited above the layer, the effect of the increased loading is to increase the particle-to-particle stresses resulting in porosity reduction primarily through a more efficient packing of the particles and to a lesser extent through elastic compression and pressure solution. The initial porosity of a sediment depends on its lithology. Mudstones start with porosities of >60%, sandstones typically ~40% and carbonates sometimes as high as 70%.

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 23 · template: T3-text-and-image -->
## Pure Shear and Simple Shear
![](Module-iii-Theory/Lecture2-restored/slide023.png) <!-- .element style="display:block; margin-left:auto; margin-right:auto; width:88%" -->

<p class="caption">Fossen, 2010</p>

**Pure shear** is a homogeneous flattening &mdash; usually treated as a plane strain, with no volume change. **Simple shear** keeps parallel planes parallel and equally spaced while sliding them past one another, which carries an internal rotation with it.

That rotation is the whole difference. Under a **coaxial** deformation the principal axes point the same way however much strain accumulates, and only their lengths change. Under a **non-coaxial** one they swing as the strain grows, so the answer depends on how far the deformation has gone.

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 24 · template: T3-text-and-image -->
## Flinn Diagram
<div class="cols">
<div class="wide">

- The Flinn Diagram allows the representation of every type of regular ellipsoid by comparing the two strain ratios between X/Y and Y/Z.
- The logarithm function conveniently scale the strain axes ratios.
- Two important parameters of D and K in the Flinn Diagram:
- Strain-related fabric depend on the shape of the finite strain ellipsoid.

$$K = \frac{\ln [X/Y]}{\ln [Y/Z]} \qquad D = \sqrt{\left(\ln \tfrac{X}{Y}\right)^{2} + \left(\ln \tfrac{Y}{Z}\right)^{2}}$$

</div>
<div>

![](Module-iii-Theory/Lecture2-restored/slide024.png)

<p class="caption">Patrice Rey, USyd</p>

</div>
</div>

Note:
The parameter D is the distance between the origin of the graph (that represent the initial sphere) and the ellipsoid (in red on the diagram). The parameter K is the slope between the abscissa axis and the line joining the ellipsoid and the origin of the diagram. Cigar shaped ellipsoids locate along the ordinate axis (i.e. K is infinite) where the strain is said to be constructional. Pancake shaped ellipsoids locate along the abscissa axis (K=0) where the strain is said to be flattening. Plane strain (K=1) characterizes the ellipsoids for which &2 axis remains constant despite strain. 
Strain-related fabric depend on the shape of the finite strain ellipsoid. Pancake shaped ellipsoids lead to S tectonites (strong schistosity, no lineation), cigar shaped ellipsoids lead to L tectonites (strong lineation, no schistosity). L=S tectonites are produced by plane strain.

<--o-->

## Methods for Strain Measurements

To decipher strain from deformed rocks, we target at strain markers – objects reflecting the distortion that has taken place: pebbles, mineral grains, ooids, pillows in pillow lavas, trilobites, worm burrows, xenoliths are good examples of strain markers.

Common methods to measure strain include:
- The Wellman method
- The Breddin graph
- The Fry method
- Elliptical objects and Rf/𝝋 method
- Center-to-center method
- E-learning modules of Fossen, 2011.

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 26 · template: T3-text-and-image -->
## The Fry Method for Strain Analysis
<div class="cols">
<div class="wide">

The most elegant of the methods, and the easiest to do. The particles can be anything &mdash; quartz grains, garnet, pebbles. What it assumes is that *before* deformation their spacing was statistically **isotropic**: the distance between two particles did not depend on which direction you measured it in.

The procedure:

1. Pick a particle, and mark the position of each of its neighbours relative to it.
2. Repeat for as many particles as you can, plotting every one on the same diagram.
3. Do it again on a second, perpendicular section, to get all three axes of the ellipsoid.

</div>
<div>

![](Module-iii-Theory/Lecture2-extracted/slide026_img1.jpg)

![](Module-iii-Theory/Lecture2-extracted/slide026_img2.jpg)

<p class="caption">Patrice Rey, USyd</p>

</div>
</div>

Note:
One way to demonstrate this is to plot on a tracing paper the position of particles (in red on the sketch below on the left) neighbouring a chosen particle (crossed white spot) and to repeat this operation for as many particles as possible. The result is shown on the sketch below on the right. This sketch shows that particles are disbributed around a circle of radius the average distance between particles. There is no strain.
After deformation the distance between two particles aligned with &1 increases whereas two particles aligned in the direction of &3 got closer. If strain is homogeneous, the sphere is transformed into an ellipsoid. To determine the three axes of this ellipsoid structural geologists work successively on two perpendicular sections (thin sections, saw cuts through hand specimens, photographs) containing two of the three principal strain axes

## The Rf/$\phi$ Method for Strain Analysis
<div class="cols">
<div>

![](Module-iii-Theory/Lecture2-extracted/slide027_img1.jpg)

<p class="caption">Fossen, 2010</p>

</div>
<div class="wide">

- More general case for initial condition of deformed rocks.
- Strain intensity can be assessed by the shape of deformable sub-spherical objects.
- By measuring the axial ratios of those ellipsoids in a final state (Rf) as a function of $\phi$, the true strain (Rs) = $\sqrt{(R_\textrm{fmax}/R_\textrm{fmin})}$ for a lower-strain cases and $\sqrt{(R_\textrm{fmax} \cdot R_\textrm{fmin})}$ for higher-strain cases.

- EllipseFit program for finite strain analysis.

</div>
</div>

Note:
Subspherical objects such as quartz aggregates in granitic rocks, pebbles in conglomerates. 
Phi represents the angle between the long axis of the strain ellipse or sub-spherical objects and a reference line (such as the horizontal line in this figure).

Neither one gives you the other. You cannot predict the strain from the stress alone, and you cannot read the stress off a strain ellipse alone. Something else is always needed &mdash; the boundary conditions, the rheology, how long it went on for.

## Elastic Strain Caused by a Seismic Wave
<div class="cols">
<div>

![](Module-iii-Theory/Lecture2-extracted/slide030_img2.jpg) <!-- .element style="width:77%;" -->

![](Module-iii-Theory/Lecture2-extracted/slide030_img1.jpg) <!-- .element style="width:84%;" -->

<p class="caption">www.seis-insight.eu</p>

</div>
<div class="wide">

Some of the energy an earthquake or explosion releases travels off as elastic waves. A seismogram measures, amplifies and records what those waves do to the ground &mdash; which is a **displacement**.

And strain is the spatial derivative of displacement, so the record converts straight into strain. How much depends on which wave is passing; it is usually below $10^{-5}$, which is why the rock springs back and the record stays elastic.

</div>
</div>

Note:
You have seen the strain expressed as the partial derivative of displacement relative to space, and you might also wonder how useful that is. And here is one particular example of describing the elastic strain caused by a seismic wave. 
The east-west component of ground motion at the Berkeley station recorded by the Bosch Omori seismograph on March 10, 1922, from an earthquake source near Parkfield, California. The recording is part of the basis of the "Parkfield Prediction Experiment" (1988 ± 5 years). Reproduced on a wine label printed for the Centennial Symposium, May 28–30, 1987.

<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 31 · template: T3-text-and-image -->
## Example: Strain from a Seismic Wave
<div class="cols">
<div class="wide">

A seismic plane shear wave is travelling through a solid with displacement that can be locally approximated as:
$$u_z = A\sin\left[2\pi f\left(t-\tfrac{x}{c}\right)\right]$$

where $A$ is the amplitude, $f$ the frequency and $c$ the wave speed. Estimate the maximum strain for a wave of $f = 2$ Hz, $c = 3.14$ km/s, $A = 1$ mm.

**Solutions:** Strain is the spatial derivative of the displacement:
$$\frac{\partial u_z}{\partial x}=\frac{-2\pi fA}{c} \cos [2\pi f(t-\frac{x}{c})]$$
- The maximum occurs when cos[x] = -1 and thus
$$\left( \frac{\partial u_z}{\partial x} \right)_{max}=\frac{2\pi fA}{c}$$
- Putting the numbers in gives a maximum strain of $4 \times 10^{-6}$.

<small>

**Derivatives, as a reminder.** &nbsp; $\sin x \rightarrow \cos x$ &nbsp;&middot;&nbsp; $\cos x \rightarrow -\sin x$ &nbsp;&middot;&nbsp; $x^a \rightarrow a\\,x^{a-1}$

By the chain rule, with $y = ax+b$: &nbsp; $\frac{d}{dx}\sin(ax+b) = \cos(y)\cdot\frac{dy}{dx} = a\cos(ax+b)$

</small>

</div>

</div>

## Strain Rate

Strain rate ($\dot{\epsilon}$, units $\mathrm{s}^{-1}$) was defined in [Module 1.3 §7](Module-i-GlobalTectonics-3.reveal.html#/7), along with the $\sim 10^{-15}\ \mathrm{s}^{-1}$ typical of a plate boundary. It depends on the stress applied and on the strength of the material.

The useful way to read it is as a **change of velocity over distance**: two blocks moving at $v_1$ and $v_2$ strain the ground between them, and the closer together they are, the harder that ground is worked.

![](Module-iii-Theory/Lecture2-restored/slide032.png) <!-- .element style="display:block; margin-left:auto; margin-right:auto; width:94%" -->

<p class="caption">Simple shear, and strain rate as a velocity gradient · Dan Spencer, Oxford</p>

Note:
Used to talk about the viscous materials. The elastic materials will deform instantaneously, like extend a spring. 
The strain rate at some point within the material measures the rate at which the distances of adjacent parcels of the material change with time in the neighborhood of that point.


<--o-->

<!-- source: Lecture2_Strain_StrainRate.pptx slide 33 · template: T1-prose -->
## Strain Rate
Q1: Calculate the strain rate if 50% strain is achieved in ~20 min (sandbox).

Q2: Estimate the strain rate of a fault of 500 km long moving 30 km in 1 m.y.?

Solutions:
- $\dot{\epsilon} = 0.5/1200 = 4.2 \times 10^{-4}\ \mathrm{s}^{-1}$
- $\epsilon = 30/500 = 0.06$, or 6%
- $\dot{\epsilon} = 0.06 / 1\ \mathrm{m.y.} = 0.06 / (1 \times 10^{6}\ \mathrm{y}) = 6 \times 10^{-8}\ \mathrm{y}^{-1}$

Note:
Used to talk about the viscous materials. The elastic materials will deform instanously, like extend a spring. 
Has a unit of reciprocal time.

<--o-->

## Strain Rate Tensor
Recall that the strain tensor expressed using displacement:
$$\epsilon_{ij}=\frac{1}{2}\left[ \frac{{\partial u} _ {i}}{{\partial x} _ {j}}+\frac{{\partial u} _ {j}}{{\partial x} _ {i}} \right]$$

The strain rate tensor can then replace the displacement vector in the strain with velocity vector:
$$D_{ij}=\frac{1}{2}\left[ \frac{{\partial v} _ {i}}{{\partial x} _ {j}}+\frac{{\partial v} _ {j}}{{\partial x} _ {i}} \right] \quad \textrm{or} \quad \left[ \begin{matrix} D_{xx} & D_{xy} & D_{xz} \cr D_{yx} & D_{yy} & D_{yz} \cr D_{zx} & D_{zy} & D_{zz} \end{matrix} \right]$$

The strain rate tensor also has three principal strain rates direction where all shear values vanish. The diagonal sums to zero if the material is incompressible (i.e., zero trace, first invariant is zero). The second invariant is defined from the principal values and represents the magnitude.

Where $u_i$ is the displacement in direction $i$; $i$ and $j$ can be any of 1, 2, 3, and the coordinates $x, y, z$ are then referred to as $x_1, x_2, x_3$.

Note:
In fluid mechanics, the compressibility is a measure of the relative volume change of a fluid or solid as a response to a pressure (or mean stress) change.
